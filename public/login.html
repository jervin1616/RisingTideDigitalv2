<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Rising Tide Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    body { background: var(--gray-50); min-height: 100vh; display: flex; flex-direction: column; }

    .auth-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
    }

    .auth-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      margin-bottom: 32px;
      text-decoration: none;
    }

    .auth-logo-mark {
      width: 44px;
      height: 44px;
      background: var(--navy);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--gold);
    }

    .auth-logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .auth-logo-name {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--navy);
    }

    .auth-logo-tagline {
      font-size: 0.68rem;
      color: var(--gold);
      letter-spacing: 0.04em;
    }

    .auth-card {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: var(--shadow);
    }

    .auth-card h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .auth-card > p {
      color: var(--gray-400);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.875rem;
      color: var(--gray-400);
    }

    .auth-footer a { color: var(--navy); font-weight: 600; }
    .auth-footer a:hover { color: var(--gold); }

    .divider-text {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--gray-400);
      font-size: 0.8rem;
      margin: 20px 0;
    }

    .divider-text::before,
    .divider-text::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-200);
    }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-container">

      <a href="/index.html" class="auth-logo">
        <div class="auth-logo-mark">RT</div>
        <div class="auth-logo-text">
          <span class="auth-logo-name">Rising Tide Digital</span>
          <span class="auth-logo-tagline">Built for the coast. Designed to grow.</span>
        </div>
      </a>

      <div class="auth-card">
        <h1>Welcome back</h1>
        <p>Sign in to your client account</p>

        <div id="form-msg" class="form-message" style="display:none"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
            <span class="form-error" id="email-error"></span>
          </div>

          <div class="form-group">
            <label for="password" style="display:flex;justify-content:space-between;align-items:center">
              <span>Password</span>
              <a href="/contact.html" style="font-size:0.8rem;color:var(--gold);font-weight:400">Forgot password?</a>
            </label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            <span class="form-error" id="password-error"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;padding:14px;font-size:1rem">
            Sign In
          </button>
        </form>

        <div class="divider-text">or</div>

        <a href="/booking.html" class="btn btn-outline-navy btn-full" style="text-align:center">
          Book a Free Consultation
        </a>
      </div>

      <p class="auth-footer">
        Don't have an account? <a href="/register.html">Create one — it's free</a>
      </p>

      <p style="text-align:center;margin-top:20px">
        <a href="/index.html" style="font-size:0.8rem;color:var(--gray-400)">← Back to website</a>
      </p>

    </div>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
